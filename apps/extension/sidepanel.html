<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOM Mutation Recorder</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, sans-serif; padding: 1rem; background: Canvas; color: CanvasText; }
      .stack { display: grid; gap: .75rem; }
      .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
      .status { padding: .25rem .5rem; border-radius: 999px; font-size: .875rem; background: color-mix(in srgb, CanvasText 10%, transparent); }
      .status.live { background: #0f766e; color: white; }
      .status.idle { background: #374151; color: white; }
      .status.stopped { background: #4b5563; color: white; }
      .status.error { background: #991b1b; color: white; }
      button, input { font: inherit; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      .panel { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: .75rem; padding: .75rem; }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="row">
        <strong>DOM Mutation Recorder</strong>
        <span id="status" class="status idle">Idle</span>
      </div>
      <div class="row">
        <button id="refresh">Refresh active tab</button>
        <button id="start">Start recording</button>
        <button id="stop" disabled>Stop</button>
        <button id="copy-ai" disabled>Copy AI drop</button>
        <button id="copy-json" disabled>Copy JSON</button>
      </div>
      <div class="panel">
        <div id="tab-info">No active recording.</div>
      </div>
      <div class="panel">
        <div class="row">
          <strong>AI drop preview</strong>
        </div>
        <pre id="preview">Start a recording to generate clipboard output.</pre>
      </div>
    </div>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
